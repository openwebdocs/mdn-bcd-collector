version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      exclude:
         - "@mdn/*"
         - "@webref/*"
    groups:
      data:
        patterns:
          - "@mdn/*"
          - "@webref/*
      dev:
        exclude-patterns:
          - "@mdn/*"
          - "@webref/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
